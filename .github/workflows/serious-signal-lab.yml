name: Serious Signal Branch Lab

on:
  push:
    branches:
      - "agent/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: serious-signal-lab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: Branch-only code and safety checks (no simulated performance)
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SWING_UP_TEST_MODE: "true"
      AI_COMMITTEE_DRY_RUN_DEFAULT: "true"
      PUBLIC_LEDGER_TRACKING_ENABLED: "false"
      PUBLIC_TRACKING_ENABLED: "false"

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Refuse main branch execution
        shell: bash
        run: |
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          if [[ "${branch}" == "main" ]]; then
            echo "Serious Signal Lab is forbidden on main." >&2
            exit 1
          fi
          echo "Testing isolated branch: ${branch}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Typecheck
        run: npm run typecheck

      - name: Verify PR #262 controlled five-minute runtime
        run: npm run smoke:pr262-runtime-pause

      - name: Verify PR #262 sensor-to-committee authority path
        run: npm run smoke:pr262-sensor-foundation && npm run smoke:pr262-cloudflare-sensor && npm run smoke:pr262-event-job && npm run smoke:pr262-committee-authority

      - name: Verify Cloudflare and Railway production contracts
        run: npm run smoke:pr262-storage-namespace && npm run smoke:pr262-provider-budget-durability && npm run smoke:pr262-ai-daily-cost-fuse && npm run smoke:pr262-analysis-only-orchestrator && npm run smoke:pr262-route-auth && npm run smoke:r2-prefix-list && npm run smoke:serious-signal-delivery && npm run smoke:pr262-live-serious-signal-surface

      - name: Validate both Cloudflare Worker bundles
        run: npm run check:pr262-cloudflare-bundle

      - name: Verify live-lab evidence and provider policies
        run: npm run smoke:branch-lab-policy && npm run smoke:r2-preview-write-guard && npm run smoke:branch-learning-ledger && npm run smoke:equity-universe-fallback && npm run smoke:equity-event-semantics && npm run smoke:equity-event-sources && npm run smoke:equity-historical-analogs && npm run smoke:equity-historical-bootstrap && npm run smoke:equity-event-first-runner && npm run smoke:equity-five-case-pilot && npm run smoke:equity-history-optional-pilot && npm run smoke:equity-industry-peer-pilot && npm run smoke:equity-article-evidence && npm run smoke:us-watch-out-engine && npm run smoke:watch-out-serious-promotion && npm run smoke:us-value-investing-engine && npm run smoke:us-value-investing-safety && npm run smoke:catalyst-company-diligence && npm run smoke:equity-sec-filing-details && npm run smoke:ai-committee-crypto-policy && npm run smoke:ai-committee-provider-guardrails

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Start isolated PR262 application
        shell: bash
        env:
          RAILWAY_GIT_BRANCH: agent/combined-opportunity-engine
        run: |
          npm start -- --hostname 127.0.0.1 --port 3010 > /tmp/swing-up-branch.log 2>&1 &
          echo $! > /tmp/swing-up-branch.pid

      - name: Verify branch isolation and committee safety gates
        env:
          SWING_UP_EVAL_BASE_URL: http://127.0.0.1:3010
          RAILWAY_GIT_BRANCH: agent/combined-opportunity-engine
        run: npm run smoke:branch-lab-security

      - name: Verify dedicated five-minute alarm process mechanics
        run: npm run smoke:branch-worker-process

      - name: Start production-compatible application boundary
        shell: bash
        env:
          SWING_UP_INTERNAL_API_TOKEN: ci-pr262-internal-token
          SWING_UP_SERIOUS_SIGNAL_READ_TOKEN: ci-pr262-read-token
        run: |
          env -u RAILWAY_GIT_BRANCH npm start -- --hostname 127.0.0.1 --port 3011 > /tmp/swing-up-production-compat.log 2>&1 &
          echo $! > /tmp/swing-up-production-compat.pid

      - name: Verify normal production API remains available and mutation routes require auth
        env:
          SWING_UP_PRODUCTION_COMPAT_BASE_URL: http://127.0.0.1:3011
          SWING_UP_INTERNAL_API_TOKEN: ci-pr262-internal-token
          SWING_UP_SERIOUS_SIGNAL_READ_TOKEN: ci-pr262-read-token
        run: node scripts/pr262-production-api-boundary-smoke.mjs

      - name: Optional branch preview smoke
        if: ${{ github.event_name == 'workflow_dispatch' && vars.SWING_UP_BRANCH_TEST_URL != '' }}
        env:
          SWING_UP_BRANCH_TEST_URL: ${{ vars.SWING_UP_BRANCH_TEST_URL }}
          SWING_UP_AUTOMATION_TOKEN: ${{ secrets.SWING_UP_AUTOMATION_TOKEN }}
        run: node scripts/branch-preview-smoke.mjs

      - name: Show server logs on failure
        if: failure()
        run: |
          tail -200 /tmp/swing-up-branch.log || true
          tail -200 /tmp/swing-up-production-compat.log || true

      - name: Stop isolated applications
        if: always()
        run: |
          kill "$(cat /tmp/swing-up-branch.pid)" 2>/dev/null || true
          kill "$(cat /tmp/swing-up-production-compat.pid)" 2>/dev/null || true
