name: Global Directory Capability Audit

on:
  push:
    branches:
      - "agent/combined-opportunity-engine"
    paths:
      - "app/api/internal/combined-opportunity-engine/global-directory-audit/route.ts"
      - "scripts/global-directory-capability-audit.mjs"
      - ".github/workflows/global-directory-capability-audit.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app/api/internal/combined-opportunity-engine/global-directory-audit/route.ts"
      - "scripts/global-directory-capability-audit.mjs"
      - ".github/workflows/global-directory-capability-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: global-directory-capability-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit current Railway global-directory endpoints
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run current Railway capability audit
        env:
          COMBINED_ENGINE_RAILWAY_URL: https://swing-up-swing-up-pr-262.up.railway.app
          EXPECTED_BRANCH_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          SWING_UP_AUTOMATION_TOKEN: ${{ secrets.SWING_UP_AUTOMATION_TOKEN }}
          GLOBAL_DIRECTORY_AUDIT_PATH: artifacts/global-directory-capability-audit.json
        run: node scripts/global-directory-capability-audit.mjs
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-directory-capability-audit
          path: artifacts/global-directory-capability-audit.json
          if-no-files-found: warn
          retention-days: 30
