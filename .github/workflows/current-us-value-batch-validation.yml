name: Current US Resumable Value Batch Validation

on:
  push:
    branches:
      - "agent/combined-opportunity-engine"
    paths:
      - "lib/opportunity-engine/us-value-investing-resumable.ts"
      - "app/api/internal/combined-opportunity-engine/us-value-batch/route.ts"
      - "scripts/railway-branch-worker-resumable.mjs"
      - "scripts/railway-branch-start-resumable.mjs"
      - "scripts/current-us-value-batch-live-smoke.mjs"
      - "railway.json"
      - ".github/workflows/current-us-value-batch-validation.yml"
  pull_request:
    branches:
      - main
    paths:
      - "lib/opportunity-engine/us-value-investing-resumable.ts"
      - "app/api/internal/combined-opportunity-engine/us-value-batch/route.ts"
      - "scripts/railway-branch-worker-resumable.mjs"
      - "scripts/railway-branch-start-resumable.mjs"
      - "scripts/current-us-value-batch-live-smoke.mjs"
      - "railway.json"
      - ".github/workflows/current-us-value-batch-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-us-value-batch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-live-us-value-batches:
    name: Validate resumable US fair-value batches and R2 progress
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Check out isolated branch
        uses: actions/checkout@v4

      - name: Refuse main branch execution
        shell: bash
        run: |
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          test "${branch}" != "main"
          echo "Validating resumable U.S. value batches on ${branch}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Typecheck and build
        run: |
          npm run typecheck
          npm run build

      - name: Wait for exact Railway deployment and persisted value batch
        env:
          COMBINED_ENGINE_RAILWAY_URL: https://swing-up-swing-up-pr-262.up.railway.app
          EXPECTED_BRANCH_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          CURRENT_US_VALUE_BATCH_REPORT_PATH: artifacts/current-us-value-batch-report.json
        run: node scripts/current-us-value-batch-live-smoke.mjs

      - name: Upload current U.S. resumable value report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-us-value-batch-report
          path: artifacts/current-us-value-batch-report.json
          if-no-files-found: warn
          retention-days: 30
