name: Apply PR262 Event Pilot Guard

on:
  push:
    branches:
      - agent/combined-opportunity-engine
    paths:
      - "scripts/apply-pr262-event-pilot-guard.mjs"
      - ".github/workflows/apply-pr262-event-pilot-guard.yml"

permissions:
  contents: write

concurrency:
  group: apply-pr262-event-pilot-guard
  cancel-in-progress: false

jobs:
  patch:
    name: Restore mandatory 4-of-5 event history gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out exact PR262 branch
        uses: actions/checkout@v4
        with:
          ref: agent/combined-opportunity-engine
          fetch-depth: 0

      - name: Refuse any other branch
        shell: bash
        run: |
          test "$(git branch --show-current)" = "agent/combined-opportunity-engine"
          test "$(git branch --show-current)" != "main"

      - name: Apply exact policy patch
        run: node scripts/apply-pr262-event-pilot-guard.mjs

      - name: Verify policy markers
        shell: bash
        run: |
          grep -q 'evaluateFiveCasePilotGate' lib/equity-signal/runner.ts
          grep -q 'historicalComparisonRequiredForSeriousSignal: true' lib/equity-signal/runner.ts
          grep -q 'actionableBuySellRequiresCalibratedHistory: true' lib/equity-signal/runner.ts
          grep -q '&& pilotGate.passed;' lib/equity-signal/runner.ts

      - name: Commit only the repaired runner
        shell: bash
        run: |
          if git diff --quiet -- lib/equity-signal/runner.ts; then
            echo "Runner already satisfies the binding policy."
            exit 0
          fi
          git config user.name "swing-up-policy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/equity-signal/runner.ts
          git commit -m "Restore mandatory Pilot 5 event signal gate"
          git push origin HEAD:agent/combined-opportunity-engine
