name: Fix PR262 Price Scanner Marker

on:
  push:
    branches:
      - agent/combined-opportunity-engine
    paths:
      - "scripts/fix-pr262-price-scanner-marker.mjs"
      - ".github/workflows/fix-pr262-price-scanner-marker.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/combined-opportunity-engine
      - name: Refuse main
        run: test "$(git branch --show-current)" = "agent/combined-opportunity-engine"
      - name: Apply exact marker fix
        run: node scripts/fix-pr262-price-scanner-marker.mjs
      - name: Commit fixed module
        shell: bash
        run: |
          git config user.name "swing-up-policy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/opportunity-engine/us-signal-operations.ts
          git commit -m "Fix full-market price scanner boundary"
          git push origin HEAD:agent/combined-opportunity-engine
