name: Apply PR262 Buy Coverage Upgrade

on:
  push:
    branches:
      - agent/combined-opportunity-engine
    paths:
      - "scripts/apply-pr262-buy-coverage-upgrade.mjs"
      - ".github/workflows/apply-pr262-buy-coverage-upgrade.yml"

permissions:
  contents: write

concurrency:
  group: apply-pr262-buy-coverage-upgrade
  cancel-in-progress: false

jobs:
  patch:
    name: Expand live Buy coverage without lowering standards
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out exact PR262 branch
        uses: actions/checkout@v4
        with:
          ref: agent/combined-opportunity-engine
          fetch-depth: 0

      - name: Refuse any other branch
        shell: bash
        run: |
          test "$(git branch --show-current)" = "agent/combined-opportunity-engine"
          test "$(git branch --show-current)" != "main"

      - name: Apply exact coverage upgrade
        run: node scripts/apply-pr262-buy-coverage-upgrade.mjs

      - name: Verify upgraded policy
        shell: bash
        run: |
          grep -q 'const MAX_PRICE_CANDIDATES = 5_000' lib/opportunity-engine/us-signal-operations.ts
          grep -q 'recentCandidate(candidate, now, 14)' lib/opportunity-engine/us-signal-operations.ts
          grep -q 'buyQualityConfirmed: boolean' lib/opportunity-engine/us-signal-operations.ts
          grep -q 'TradingView public scanner' lib/opportunity-engine/us-signal-operations.ts

      - name: Commit only the upgraded operations module
        shell: bash
        run: |
          if git diff --quiet -- lib/opportunity-engine/us-signal-operations.ts; then
            echo "Coverage upgrade already applied."
            exit 0
          fi
          git config user.name "swing-up-policy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/opportunity-engine/us-signal-operations.ts
          git commit -m "Expand buy-first coverage to full US warehouse"
          git push origin HEAD:agent/combined-opportunity-engine
