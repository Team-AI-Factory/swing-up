name: PR262 Merge Certification

on:
  push:
    branches:
      - agent/combined-opportunity-engine
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr262-merge-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code:
    name: Deterministic code, Railway, and recovery gates
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SWING_UP_TEST_MODE: "true"
      AI_COMMITTEE_DRY_RUN_DEFAULT: "true"
      PUBLIC_LEDGER_TRACKING_ENABLED: "false"
      PUBLIC_TRACKING_ENABLED: "false"
    steps:
      - name: Check out exact candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Prove the checked-out revision is the candidate SHA
        shell: bash
        run: |
          candidate_sha="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "${candidate_sha}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Validate types, lint, and production build
        run: |
          npm run typecheck
          npm run lint
          npm run build

      - name: Certify storage, auth, queue, delivery, and visible feed contracts
        run: |
          npm run smoke:pr262-storage-namespace
          npm run smoke:pr262-provider-budget-durability
          npm run smoke:pr262-ai-daily-cost-fuse
          npm run smoke:pr262-analysis-only-orchestrator
          npm run smoke:pr262-lightweight-sensor-v3-bootstrap
          npm run smoke:pr262-production-foundation
          npm run smoke:pr262-exposure-index-completeness
          npm run smoke:pr262-route-auth
          npm run smoke:r2-prefix-list
          npm run smoke:serious-signal-delivery
          npm run smoke:pr262-live-serious-signal-surface

      - name: Certify current-evidence Serious Signal authority
        run: |
          npm run smoke:equity-event-sources
          npm run smoke:equity-universe-fallback
          npm run smoke:ai-committee-provider-guardrails
          npm run smoke:equity-event-first-runner
          npm run smoke:equity-history-optional-pilot
          npm run smoke:pr262-event-job
          npm run smoke:pr262-committee-authority
          npm run smoke:watch-out-serious-promotion
          npm run smoke:pr262-serious-watch-out-authority
          npm run smoke:us-value-investing-engine
          npm run smoke:us-value-investing-safety
          npm run smoke:catalyst-company-diligence

  migration:
    name: Main database to PR262 migration rehearsal
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: swing_up_pr262_cert
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d swing_up_pr262_cert"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/swing_up_pr262_cert
    steps:
      - name: Check out exact candidate SHA with main history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Prove the checked-out revision is the candidate SHA
        shell: bash
        run: |
          candidate_sha="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "${candidate_sha}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Resolve and check out the exact base revision
        shell: bash
        run: |
          git fetch --no-tags origin main
          base_sha="${{ github.event.pull_request.base.sha }}"
          if [[ -z "${base_sha}" ]]; then
            base_sha="$(git merge-base HEAD origin/main)"
          fi
          git merge-base --is-ancestor "${base_sha}" HEAD
          git worktree add --detach /tmp/swing-up-pr262-base "${base_sha}"
          git rev-parse HEAD
          git -C /tmp/swing-up-pr262-base rev-parse HEAD

      - name: Apply main migrations and seed representative existing rows
        shell: bash
        run: |
          ./node_modules/.bin/prisma migrate deploy --schema /tmp/swing-up-pr262-base/prisma/schema.prisma
          psql "${DATABASE_URL}" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO alerts (id, ticker, company, action, event, status)
          VALUES ('11111111-1111-4111-8111-111111111111', 'BASE', 'Baseline Corp', 'watch', 'Existing production row', 'draft');
          INSERT INTO alert_scores (id, alert_id, profit_potential, evidence_confidence, risk_level, priced_in_check)
          VALUES ('22222222-2222-4222-8222-222222222222', '11111111-1111-4111-8111-111111111111', 61, 72, 'medium', 'unknown');
          INSERT INTO price_snapshots (id, ticker, price, captured_at)
          VALUES ('33333333-3333-4333-8333-333333333333', 'BASE', 123.45, '2026-08-01T00:00:00Z');
          SQL

      - name: Apply PR262 migrations and verify migration status
        run: |
          npm run db:migrate
          ./node_modules/.bin/prisma migrate status
          ./node_modules/.bin/prisma validate

      - name: Prove data preservation, precision, defaults, indexes, and cascade
        shell: bash
        run: |
          psql "${DATABASE_URL}" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            baseline_count integer;
            migrated_columns integer;
            index_count integer;
            fk_delete_action "char";
            precision_value integer;
            scale_value integer;
          BEGIN
            SELECT count(*) INTO baseline_count
            FROM price_snapshots
            WHERE id = '33333333-3333-4333-8333-333333333333'
              AND ticker = 'BASE'
              AND price = 123.45
              AND provider = 'manual'
              AND currency = 'USD'
              AND data_quality = 'unverified';
            IF baseline_count <> 1 THEN
              RAISE EXCEPTION 'baseline price snapshot was not preserved with safe defaults';
            END IF;

            SELECT count(*) INTO migrated_columns
            FROM information_schema.columns
            WHERE table_schema = 'public'
              AND ((table_name = 'alert_scores' AND column_name IN ('input_completeness', 'live_data_ready', 'missing_inputs', 'input_provenance'))
                OR (table_name = 'price_snapshots' AND column_name IN ('alert_id', 'provider', 'provider_asset_id', 'currency', 'source_url', 'data_quality')));
            IF migrated_columns <> 10 THEN
              RAISE EXCEPTION 'expected 10 additive PR262 columns, found %', migrated_columns;
            END IF;

            SELECT numeric_precision, numeric_scale INTO precision_value, scale_value
            FROM information_schema.columns
            WHERE table_schema = 'public' AND table_name = 'price_snapshots' AND column_name = 'price';
            IF precision_value <> 20 OR scale_value <> 8 THEN
              RAISE EXCEPTION 'price precision is (%,%) instead of (20,8)', precision_value, scale_value;
            END IF;

            SELECT count(*) INTO index_count
            FROM pg_indexes
            WHERE schemaname = 'public' AND indexname IN (
              'price_snapshots_alert_id_provider_captured_at_key',
              'price_snapshots_alert_id_captured_at_idx',
              'price_snapshots_ticker_data_quality_captured_at_idx'
            );
            IF index_count <> 3 THEN
              RAISE EXCEPTION 'expected 3 PR262 price indexes, found %', index_count;
            END IF;

            SELECT confdeltype INTO fk_delete_action
            FROM pg_constraint
            WHERE conname = 'price_snapshots_alert_id_fkey';
            IF fk_delete_action IS DISTINCT FROM 'c' THEN
              RAISE EXCEPTION 'price snapshot foreign key is not ON DELETE CASCADE';
            END IF;
          END $$;

          INSERT INTO alerts (id, ticker, company, action, event, status)
          VALUES ('44444444-4444-4444-8444-444444444444', 'PREC', 'Precision Corp', 'buy', 'Precision test', 'draft');
          INSERT INTO price_snapshots (id, alert_id, ticker, price, captured_at, provider, currency, data_quality)
          VALUES ('55555555-5555-4555-8555-555555555555', '44444444-4444-4444-8444-444444444444', 'PREC', 123.45678901, '2026-08-02T00:00:00Z', 'certification', 'USD', 'live');
          DELETE FROM alerts WHERE id = '44444444-4444-4444-8444-444444444444';

          DO $$
          BEGIN
            IF EXISTS (SELECT 1 FROM price_snapshots WHERE id = '55555555-5555-4555-8555-555555555555') THEN
              RAISE EXCEPTION 'linked price snapshot did not cascade on alert deletion';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM price_snapshots WHERE id = '33333333-3333-4333-8333-333333333333') THEN
              RAISE EXCEPTION 'unlinked baseline snapshot was incorrectly deleted';
            END IF;
          END $$;
          SQL
