name: Current US Value Investing Validation

on:
  push:
    branches:
      - "agent/combined-opportunity-engine"
    paths:
      - "lib/opportunity-engine/us-value-investing-engine.ts"
      - "lib/equity-signal/pilot-runner.ts"
      - "lib/equity-signal/article-evidence.ts"
      - "app/api/internal/railway-branch-signal-lab/route.ts"
      - "scripts/equity-article-evidence-smoke.mjs"
      - "scripts/current-us-value-investing-live-smoke.mjs"
      - "config/serious-signal-quality.json"
      - ".github/workflows/current-us-value-investing-validation.yml"
  pull_request:
    branches:
      - main
    paths:
      - "lib/opportunity-engine/us-value-investing-engine.ts"
      - "lib/equity-signal/pilot-runner.ts"
      - "lib/equity-signal/article-evidence.ts"
      - "app/api/internal/railway-branch-signal-lab/route.ts"
      - "scripts/equity-article-evidence-smoke.mjs"
      - "scripts/current-us-value-investing-live-smoke.mjs"
      - "config/serious-signal-quality.json"
      - ".github/workflows/current-us-value-investing-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: current-us-value-investing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-live-us-value-warehouse:
    name: Validate current US fair-value warehouse and R2 persistence
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out isolated branch
        uses: actions/checkout@v4

      - name: Refuse main branch execution
        shell: bash
        run: |
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          test "${branch}" != "main"
          echo "Validating live U.S. value warehouse on ${branch}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Typecheck and build
        run: |
          npm run typecheck
          npm run build

      - name: Wait for exact Railway deployment and validate value warehouse
        env:
          COMBINED_ENGINE_RAILWAY_URL: https://swing-up-swing-up-pr-262.up.railway.app
          EXPECTED_BRANCH_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          CURRENT_US_VALUE_REPORT_PATH: artifacts/current-us-value-investing-report.json
        run: node scripts/current-us-value-investing-live-smoke.mjs

      - name: Upload current U.S. value-investing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-us-value-investing-report
          path: artifacts/current-us-value-investing-report.json
          if-no-files-found: warn
          retention-days: 30
