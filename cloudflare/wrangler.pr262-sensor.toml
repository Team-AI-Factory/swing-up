name = "swing-up-pr262-cheap-sensor"
main = "pr262-sensor-worker.mjs"
compatibility_date = "2026-08-19"
workers_dev = false

[triggers]
crons = ["*/5 * * * *"]

[limits]
cpu_ms = 10000
subrequests = 32

[observability]
enabled = true
head_sampling_rate = 1

[vars]
SENSOR_OWNER = "cloudflare_worker"
SENSOR_DEPLOYMENT_MODE = "production"
ANALYSIS_HANDOFF_ENABLED = "true"
SENSOR_WALL_MS = "42000"
SENSOR_STATE_KEY = "production/pr262/sensor/state-v1.json"
SENSOR_RUN_PREFIX = "production/pr262/sensor/runs"
EQUITY_UNIVERSE_KEY = "production/pr262/equity-universe/v1.json"
EXPOSURE_INDEX_KEY = "production/pr262/sensor/exposure-index-v1.json"
DIRECT_FEEDS_KEY = "production/pr262/sensor/direct-company-feeds-v1.json"
RAILWAY_HANDOFF_URL = "https://replace-with-railway-host.example.invalid/api/internal/combined-opportunity-engine/cloudflare-sensor-handoff"
RAILWAY_HANDOFF_HOST_ALLOWLIST = "replace-with-railway-host.example.invalid"
FMP_COMMERCIAL_USE_APPROVED = "false"

[[r2_buckets]]
binding = "SENSOR_R2"
bucket_name = "swingup"

[[durable_objects.bindings]]
name = "SENSOR_COORDINATOR"
class_name = "SensorCoordinator"

[exports.SensorCoordinator]
type = "durable-object"
storage = "sqlite"
