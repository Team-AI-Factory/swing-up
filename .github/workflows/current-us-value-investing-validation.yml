name: Legacy US Value Investing Validation (Manual Only)

# The single-shot value warehouse was superseded by the resumable 500-company
# R2 batch architecture. Keep this workflow only for manual historical diagnosis;
# PR health is validated by Current US Resumable Value Batch Validation plus the
# Buy-first signal, source-first, SEC, and verified-signal workflows.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-diagnostic-only:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out isolated branch
        uses: actions/checkout@v4
      - name: Refuse main branch execution
        shell: bash
        run: |
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          test "${branch}" != "main"
          echo "Legacy single-shot value diagnostic on ${branch}; not a current PR quality gate."
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Typecheck and build
        run: |
          npm run typecheck
          npm run build
      - name: Run legacy diagnostic
        env:
          COMBINED_ENGINE_RAILWAY_URL: https://swing-up-swing-up-pr-262.up.railway.app
          EXPECTED_BRANCH_COMMIT: ${{ github.sha }}
          CURRENT_US_VALUE_REPORT_PATH: artifacts/current-us-value-investing-report.json
        run: node scripts/current-us-value-investing-live-smoke.mjs
      - name: Upload legacy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-current-us-value-investing-report
          path: artifacts/current-us-value-investing-report.json
          if-no-files-found: warn
          retention-days: 30
