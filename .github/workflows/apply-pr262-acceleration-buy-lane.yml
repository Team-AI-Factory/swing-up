name: Apply PR262 Acceleration Buy Lane

on:
  push:
    branches:
      - agent/combined-opportunity-engine
    paths:
      - "scripts/apply-pr262-acceleration-buy-lane.mjs"
      - ".github/workflows/apply-pr262-acceleration-buy-lane.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/combined-opportunity-engine
          fetch-depth: 0
      - name: Refuse main
        run: test "$(git branch --show-current)" = "agent/combined-opportunity-engine"
      - name: Apply exact acceleration patch
        run: node scripts/apply-pr262-acceleration-buy-lane.mjs
      - name: Verify added Buy paths
        shell: bash
        run: |
          grep -q 'fundamentalAccelerationBridge: true' lib/opportunity-engine/us-signal-operations.ts
          grep -q 'megaCapCloudPlatformModel: true' lib/opportunity-engine/us-signal-operations.ts
          grep -q 'source: "fundamental_acceleration"' lib/opportunity-engine/us-signal-operations.ts
          grep -q 'model: "mega_cap_cloud_platform"' lib/opportunity-engine/us-signal-operations.ts
      - name: Commit upgraded operations module
        shell: bash
        run: |
          git config user.name "swing-up-policy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add lib/opportunity-engine/us-signal-operations.ts
          git commit -m "Add direct fundamental acceleration Buy lane"
          git push origin HEAD:agent/combined-opportunity-engine
