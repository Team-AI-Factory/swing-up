name: US Five-Case Pilot History

on:
  push:
    branches:
      - "agent/combined-opportunity-engine"
    paths:
      - "lib/equity-signal/pilot-historical-bootstrap.ts"
      - "lib/equity-signal/pilot-serious-signal-policy.ts"
      - "lib/equity-signal/historical-analogs.ts"
      - "scripts/validate-us-five-case-pilot-history.mjs"
      - "package.json"
      - ".github/workflows/us-five-case-pilot-history.yml"
  pull_request:
    branches:
      - main
    paths:
      - "lib/equity-signal/pilot-historical-bootstrap.ts"
      - "lib/equity-signal/pilot-serious-signal-policy.ts"
      - "lib/equity-signal/historical-analogs.ts"
      - "scripts/validate-us-five-case-pilot-history.mjs"
      - "package.json"
      - ".github/workflows/us-five-case-pilot-history.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: us-five-case-pilot-history-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Rebuild five-case Buy Sell analogs from public prices
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      US_FIVE_CASE_PILOT_REPORT_PATH: artifacts/us-five-case-pilot-history.json
    steps:
      - name: Check out isolated branch
        uses: actions/checkout@v4

      - name: Refuse main
        shell: bash
        run: |
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          test "${branch}" != "main"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Rebuild real historical outcomes and evaluate pilot gate
        run: npm run validate:us-five-case-pilot-history

      - name: Upload pilot report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-five-case-pilot-history
          path: artifacts/us-five-case-pilot-history.json
          if-no-files-found: error
          retention-days: 30
